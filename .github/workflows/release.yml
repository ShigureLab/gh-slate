name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-provenance:
    name: Require the tag commit on the trusted default branch
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout trusted default-branch history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # This catches accidental tags before an environment approval. The
      # protected environment below is the security boundary because a tag can
      # carry a modified copy of this workflow and omit this check.
      - name: Require the tagged commit to be merged
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          git show-ref --verify "${default_ref}"
          git cat-file -e "${GITHUB_SHA}^{commit}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "${default_ref}"

  release-gate:
    name: Test and verify exact release artifacts
    needs: release-provenance
    runs-on: ubuntu-latest
    environment: gh-slate-release
    permissions:
      contents: read

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Prettier
        run: npm install --global prettier

      - name: Install locked development dependencies
        run: just ci-install

      - name: Validate and install the bundled agent skill
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL_INSTALL_DIR: ${{ runner.temp }}/installed-gh-slate-skill
        run: |
          gh skill publish --dry-run .
          gh skill install . gh-slate \
            --from-local \
            --dir "${SKILL_INSTALL_DIR}"
          test -f "${SKILL_INSTALL_DIR}/gh-slate/SKILL.md"
          uv run python scripts/check_skill.py \
            "${SKILL_INSTALL_DIR}/gh-slate"
          gh skill publish --dry-run "${SKILL_INSTALL_DIR}"

      - name: Run formatting and static gates
        run: |
          just ci-fmt-check
          just ci-lint

      - name: Run the complete deterministic suite
        run: just ci-test

      - name: Require disposable live targets for a tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          ISSUE_TARGET: ${{ secrets.GH_SLATE_LIVE_DISPOSABLE_ISSUE_URL }}
          LIVE_TOKEN: ${{ secrets.GH_SLATE_LIVE_TOKEN }}
          PR_TARGET: ${{ secrets.GH_SLATE_LIVE_DISPOSABLE_PR_URL }}
        run: |
          test -n "${ISSUE_TARGET}"
          test -n "${LIVE_TOKEN}"
          test -n "${PR_TARGET}"

      - name: Run credentialed Issue and Pull Request lifecycle gates
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GH_SLATE_LIVE_TOKEN }}
          GH_SLATE_LIVE_CONFIRM: I_UNDERSTAND
          GH_SLATE_LIVE_DISPOSABLE_ISSUE_URL: ${{ secrets.GH_SLATE_LIVE_DISPOSABLE_ISSUE_URL }}
          GH_SLATE_LIVE_DISPOSABLE_PR_URL: ${{ secrets.GH_SLATE_LIVE_DISPOSABLE_PR_URL }}
        run: uv run pytest -q tests/live/test_github_e2e.py -rs

      - name: Create a clean artifact directory
        run: |
          test ! -e release-artifacts
          mkdir -p release-artifacts/python

      - name: Build wheel and sdist once
        run: >-
          uv build --no-sources
          --out-dir release-artifacts/python

      - name: Verify metadata, clean installs, CLIs, and extension bundles
        shell: bash
        run: |
          arguments=(
            --project-root .
            --dist-dir release-artifacts/python
            --manifest release-artifacts/SHA256SUMS
          )
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            arguments+=(
              --tag "${GITHUB_REF_NAME}"
              --extension-dir release-artifacts/github
            )
          fi
          uv run python scripts/release_verify.py "${arguments[@]}"

      - name: Upload the one verified artifact set
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-artifacts
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  stage-release:
    name: Stage verified GitHub Release assets
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: release-gate
    runs-on: ubuntu-latest
    environment: gh-slate-release
    permissions:
      contents: write
    outputs:
      already_stable: ${{ steps.release_state.outputs.already_stable }}

    steps:
      - name: Inspect the existing tagged release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          error_file="$(mktemp)"
          trap 'rm -f "${error_file}"' EXIT
          if release_state="$(
            gh api \
              --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --jq '
                if (
                  ((.draft | type) != "boolean") or
                  ((.prerelease | type) != "boolean")
                ) then
                  "invalid"
                elif .draft then
                  "draft"
                elif .prerelease then
                  "prerelease"
                else
                  "stable"
                end
              ' \
              2>"${error_file}"
          )"; then
            :
          elif grep -Fq "HTTP 404" "${error_file}"; then
            release_state="absent"
          else
            cat "${error_file}" >&2
            exit 1
          fi

          case "${release_state}" in
            absent|prerelease)
              echo "already_stable=false" >> "${GITHUB_OUTPUT}"
              ;;
            stable)
              echo "already_stable=true" >> "${GITHUB_OUTPUT}"
              ;;
            draft)
              echo "::error::Refusing to replace an existing draft release for ${GITHUB_REF_NAME}."
              exit 1
              ;;
            *)
              echo "::error::GitHub returned an invalid release state: ${release_state}."
              exit 1
              ;;
          esac
          echo "release_state=${release_state}" >> "${GITHUB_OUTPUT}"

      - name: Require mutable staged releases
        if: steps.release_state.outputs.already_stable != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SLATE_RELEASE_ADMIN_TOKEN }}
        shell: bash
        run: |
          test -n "${GH_TOKEN}"
          release_policy="$(
            gh api \
              --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '
                if (
                  ((.enabled | type) == "boolean") and
                  ((.enforced_by_owner | type) == "boolean")
                ) then
                  if (.enabled or .enforced_by_owner) then
                    "immutable"
                  else
                    "mutable"
                  end
                else
                  "invalid"
                end
              '
          )"
          if [[ "${release_policy}" != "mutable" ]]; then
            echo "::error::The staged prerelease smoke requires immutable releases to be disabled; observed ${release_policy}."
            exit 1
          fi

      - name: Download the verified artifact set
        if: steps.release_state.outputs.already_stable != 'true'
        uses: actions/download-artifact@v8
        with:
          name: verified-release-artifacts
          path: release-artifacts

      - name: Recheck exact artifact hashes
        if: steps.release_state.outputs.already_stable != 'true'
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS

      - name: Stage a non-latest prerelease for extension installation
        if: steps.release_state.outputs.already_stable != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/python/*.whl
            release-artifacts/python/*.tar.gz
            release-artifacts/github/gh-slate-*
            release-artifacts/SHA256SUMS

  extension-smoke:
    name: Install and execute the tagged GitHub CLI extension
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: stage-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_NO_UPDATE_NOTIFIER: '1'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Isolate the extension installation
        run: echo "GH_CONFIG_DIR=${RUNNER_TEMP}/gh-slate-extension-config" >> "${GITHUB_ENV}"

      - name: Install uv for the released source bundle
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install from the tagged GitHub Release and execute it
        shell: bash
        run: |
          gh extension install "${GITHUB_REPOSITORY}" --pin "${GITHUB_REF_NAME}"
          expected_version="${GITHUB_REF_NAME#v}"
          test "$(gh slate --version)" = "gh slate ${expected_version}"
          gh slate --help | grep -F "usage: gh slate"
          gh extension list | grep -F "${GITHUB_REPOSITORY}"

      - name: Remove the isolated smoke installation
        if: always()
        run: gh extension remove slate || true

  publish-pypi:
    name: Publish verified Python artifacts to PyPI
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs:
      - release-gate
      - extension-smoke
    runs-on: ubuntu-latest
    environment: gh-slate-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download the verified artifact set
        uses: actions/download-artifact@v8
        with:
          name: verified-release-artifacts
          path: release-artifacts

      - name: Recheck exact artifact hashes
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS

      - name: Publish the already-verified wheel and sdist
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifacts/python
          skip-existing: true

      - name: Verify the exact PyPI file set and hashes
        env:
          PYPI_PROJECT: gh-slate
          PYPI_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          artifact_dir = Path("release-artifacts/python")
          expected_paths = sorted(
              (*artifact_dir.glob("*.whl"), *artifact_dir.glob("*.tar.gz")),
          )
          if len(expected_paths) != 2:
              raise SystemExit(
                  f"expected one wheel and one sdist, found {len(expected_paths)} files",
              )
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in expected_paths
          }
          version = os.environ["PYPI_VERSION"].removeprefix("v")
          url = f"https://pypi.org/pypi/{os.environ['PYPI_PROJECT']}/{version}/json"
          actual = {}
          for attempt in range(12):
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  payload = {"urls": []}

              files = payload.get("urls")
              if not isinstance(files, list):
                  raise SystemExit("PyPI release JSON does not contain a file list")
              actual = {}
              for item in files:
                  if not isinstance(item, dict):
                      raise SystemExit("PyPI release JSON contains an invalid file")
                  filename = item.get("filename")
                  digests = item.get("digests")
                  digest = digests.get("sha256") if isinstance(digests, dict) else None
                  if not isinstance(filename, str) or not isinstance(digest, str):
                      raise SystemExit("PyPI release JSON contains invalid file hashes")
                  if filename in actual:
                      raise SystemExit(f"PyPI returned duplicate filename {filename}")
                  actual[filename] = digest
              if actual == expected:
                  break
              if attempt == 11:
                  raise SystemExit(
                      f"PyPI file set or hashes differ: expected {expected!r}, observed {actual!r}",
                  )
              time.sleep(5)
          PY

  publish-release:
    name: Promote the verified prerelease to stable
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs:
      - release-gate
      - stage-release
      - extension-smoke
      - publish-pypi
    runs-on: ubuntu-latest
    environment: gh-slate-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download the same verified artifact set
        uses: actions/download-artifact@v8
        with:
          name: verified-release-artifacts
          path: release-artifacts

      - name: Recheck exact artifact hashes
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS

      - name: Download the staged GitHub Release assets
        run: |
          mkdir released-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir released-assets

      - name: Prove staged assets are the exact verified files
        shell: bash
        run: |
          expected_assets=(
            release-artifacts/python/*.whl
            release-artifacts/python/*.tar.gz
            release-artifacts/github/gh-slate-*
            release-artifacts/SHA256SUMS
          )
          printf '%s\n' "${expected_assets[@]##*/}" \
            | LC_ALL=C sort > expected-assets.txt
          find released-assets \
            -maxdepth 1 \
            -type f \
            -exec basename '{}' ';' \
            | LC_ALL=C sort > released-assets.txt
          cmp expected-assets.txt released-assets.txt

          for artifact in "${expected_assets[@]}"; do
            cmp "${artifact}" \
              "released-assets/$(basename "${artifact}")"
          done

      - name: Promote to a stable latest release only after every gate
        if: needs.stage-release.outputs.already_stable != 'true'
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease=false \
            --latest

      - name: Assert the tagged release is stable
        run: |
          test "$(
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft,.isPrerelease] | @tsv'
          )" = $'false\tfalse'

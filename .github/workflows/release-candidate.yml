name: Release Candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-provenance:
    name: Require the tag commit on the default branch
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout default-branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be merged
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          git show-ref --verify "${default_ref}"
          git cat-file -e "${GITHUB_SHA}^{commit}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "${default_ref}"

  release-gate:
    name: Test and verify exact candidate artifacts
    needs: release-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install Prettier
        run: npm install --global prettier

      - name: Install locked development dependencies
        run: just ci-install

      - name: Validate and install the bundled agent skill
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL_INSTALL_DIR: ${{ runner.temp }}/installed-gh-slate-skill
        run: |
          gh skill publish --dry-run .
          gh skill install . gh-slate \
            --from-local \
            --dir "${SKILL_INSTALL_DIR}"
          test -f "${SKILL_INSTALL_DIR}/gh-slate/SKILL.md"
          uv run python scripts/check_skill.py \
            "${SKILL_INSTALL_DIR}/gh-slate"
          gh skill publish --dry-run "${SKILL_INSTALL_DIR}"

      - name: Run formatting and static gates
        run: |
          just ci-fmt-check
          just ci-lint

      - name: Run the complete deterministic suite
        run: just ci-test

      - name: Create a clean artifact directory
        run: |
          test ! -e release-artifacts
          mkdir -p release-artifacts/python

      - name: Build wheel and sdist once
        env:
          SOURCE_DATE_EPOCH: '0'
        run: >-
          uv build --no-sources
          --offline
          --out-dir release-artifacts/python

      - name: Verify metadata, clean installs, CLIs, and extension bundles
        shell: bash
        run: |
          arguments=(
            --project-root .
            --dist-dir release-artifacts/python
            --manifest release-artifacts/SHA256SUMS
          )
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            arguments+=(
              --tag "${GITHUB_REF_NAME}"
              --extension-dir release-artifacts/github
            )
          fi
          uv run python scripts/release_verify.py "${arguments[@]}"

      - name: Record the candidate identity
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_REPOSITORY_ID: ${{ github.repository_id }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          fields = {
              "repository": os.environ["CANDIDATE_REPOSITORY"],
              "repository_id": os.environ["CANDIDATE_REPOSITORY_ID"],
              "run_id": os.environ["CANDIDATE_RUN_ID"],
              "run_attempt": os.environ["CANDIDATE_RUN_ATTEMPT"],
              "sha": os.environ["CANDIDATE_SHA"],
              "tag": os.environ["CANDIDATE_TAG"],
          }
          Path("release-artifacts/release-context.json").write_text(
              json.dumps(fields, ensure_ascii=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          PY

      - name: Upload the one verified candidate artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-artifacts
          path: release-artifacts/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

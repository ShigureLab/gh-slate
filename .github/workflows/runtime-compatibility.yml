name: Planned Runtime Compatibility

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  dependency-probe:
    name: dependencies - ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Import and exercise planned runtime dependencies
        run: >-
          uv run --isolated --no-project
          --with "jq>=1.12,<2"
          --with "jinja2>=3.1,<4"
          --with "jsonschema>=4.25,<5"
          python -c
          "import jq, jinja2, jsonschema;
          assert jq.compile('. + 1').input_value(1).first() == 2;
          assert jinja2.__version__;
          assert jsonschema.Draft202012Validator"

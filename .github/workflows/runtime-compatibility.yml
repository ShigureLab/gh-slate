name: Planned Runtime Compatibility

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  dependency-probe:
    name: dependencies - ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Import and exercise planned runtime dependencies
        run: >-
          uv run --isolated --no-project
          --with "jq>=1.12,<2"
          --with "jinja2>=3.1,<4"
          --with "jsonschema>=4.25,<5"
          --with "regex>=2025.7.34,<2027"
          python -c
          "import jq, jinja2, jsonschema, regex;
          assert jq.compile('. + 1').input_value(1).first() == 2;
          assert jinja2.__version__;
          assert jsonschema.Draft202012Validator;
          assert regex.search('a+', 'aaa', timeout=0.1)"

      - name: Exercise codec wire and hash compatibility
        if: runner.os != 'Linux'
        run: |
          uv run --frozen python -c "import platform, zlib; print(f'python={platform.python_version()} zlib_compiled={zlib.ZLIB_VERSION} zlib_runtime={zlib.ZLIB_RUNTIME_VERSION}')"
          uv run --frozen pytest tests/unit/codec/test_wire_fixtures.py tests/unit/codec/test_hashes.py

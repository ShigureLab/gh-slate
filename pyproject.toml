[project]
name = "gh-slate"
version = "0.1.0"
description = "Manage named, data-backed dashboard comments on GitHub Issues and Pull Requests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1.6,<3.2",
  "jsonpatch>=1.33,<2",
  "jsonpointer>=3.1,<4",
  "jsonschema>=4.25,<5",
  "referencing>=0.36,<1",
  "regex>=2025.7.34,<2027",
  "tomli>=2.2,<3 ; python_full_version < '3.11'",
]
authors = [{ name = "Nyakku Shigure", email = "sigure.qaq@gmail.com" }]
keywords = ["github", "cli", "dashboard", "issues", "pull-requests", "markdown"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/ShigureLab/gh-slate"
Documentation = "https://github.com/ShigureLab/gh-slate"
Repository = "https://github.com/ShigureLab/gh-slate"
Issues = "https://github.com/ShigureLab/gh-slate/issues"

[project.scripts]
gh-slate = "gh_slate.__main__:main"

[dependency-groups]
dev = [
  "hypothesis>=6.167.1",
  "pyyaml>=6.0.3,<7",
  "ty>=0.0.78",
  "ruff>=0.16.6",
  "pytest>=9.1.1",
  "pytest-rerunfailures>=16.6.1",
  "tomli>=2.2,<3",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  # Pyflakes
  "F",
  # Pycodestyle
  "E",
  "W",
  # Isort
  "I",
  # Comprehensions
  "C4",
  # Debugger
  "T100",
  # Pyupgrade
  "UP",
  # Flake8-pyi
  "PYI",
  # Bugbear
  "B",
  # Pylint
  "PLE",
  # Flake8-simplify
  "SIM101",
  # Flake8-use-pathlib
  "PTH",
  # Pygrep-hooks
  "PGH004",
  # Flake8-type-checking
  "TC",
  # Flake8-raise
  "RSE",
  # Refurb
  "FURB",
  # Flake8-future-annotations
  "FA",
  # Yesqa
  "RUF100",
]
ignore = [
  "E501", # line too long, duplicate with ruff fmt
]
future-annotations = true

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["gh_slate"]
combine-as-imports = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

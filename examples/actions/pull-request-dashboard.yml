name: gh-slate same-repository pull request dashboard example

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gh-slate-${{ github.repository_id }}-pr-${{ github.event.pull_request.number }}-pr-dashboard
  cancel-in-progress: false

jobs:
  update:
    # pull_request tokens are read-only for forks. Use the reducer/consumer pair
    # below when fork Pull Requests must receive a dashboard.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only the trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Install the exact gh-slate release
        run: python -m pip install --disable-pip-version-check 'gh-slate==0.1.0'

      - name: Reduce the bounded Pull Request event
        env:
          SLATE_DATA: ${{ runner.temp }}/gh-slate-pr-data.json
        run: >-
          python trusted/examples/actions/scripts/event_to_slate.py
          pull_request "$GITHUB_EVENT_PATH" "$SLATE_DATA"

      - name: Apply one complete snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SLATE_DATA: ${{ runner.temp }}/gh-slate-pr-data.json
        run: >-
          gh-slate apply pr-dashboard
          --target @event
          --mode upsert
          --data "$SLATE_DATA"
          --schema trusted/examples/actions/schemas/pull-request-dashboard.schema.json
          --template trusted/examples/actions/templates/pull-request-dashboard.md.j2
          --json

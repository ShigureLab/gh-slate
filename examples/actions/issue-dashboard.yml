name: gh-slate issue dashboard example

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled, closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: gh-slate-${{ github.repository_id }}-issue-${{ github.event.issue.number }}-issue-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted dashboard sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Install the exact gh-slate release
        run: python -m pip install --disable-pip-version-check 'gh-slate==0.1.0'

      - name: Reduce the bounded Issue event
        env:
          SLATE_DATA: ${{ runner.temp }}/gh-slate-issue-data.json
        run: >-
          python trusted/examples/actions/scripts/event_to_slate.py
          issue "$GITHUB_EVENT_PATH" "$SLATE_DATA"

      - name: Apply one complete snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SLATE_DATA: ${{ runner.temp }}/gh-slate-issue-data.json
        run: >-
          gh-slate apply issue-dashboard
          --target @event
          --mode upsert
          --data "$SLATE_DATA"
          --schema trusted/examples/actions/schemas/issue-dashboard.schema.json
          --template trusted/examples/actions/templates/issue-dashboard.md.j2
          --json

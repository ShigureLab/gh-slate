name: gh-slate trusted pull request dashboard consumer

on:
  workflow_run:
    workflows: [gh-slate pull request payload reducer]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

# The reducer artifact selects the Pull Request inside the job, so this
# repository-wide group is intentionally stricter than per-target serialization.
concurrency:
  group: gh-slate-${{ github.repository_id }}-trusted-pr-dashboard-consumer
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only trusted reducer consumers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Download the exact triggering run artifact
        uses: actions/download-artifact@v8
        with:
          name: gh-slate-pr-reduced-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/gh-slate-reduced
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install the exact gh-slate release
        run: python -m pip install --disable-pip-version-check 'gh-slate==0.1.0'

      - name: Validate and normalize the untrusted artifact
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          REDUCED_PATH: ${{ runner.temp }}/gh-slate-reduced/pull-request.json
          SLATE_DATA: ${{ runner.temp }}/gh-slate-pr-data.json
        run: >-
          python trusted/examples/actions/scripts/validate_reduced_pull_request.py
          --input "$REDUCED_PATH"
          --data "$SLATE_DATA"
          --github-env "$GITHUB_ENV"
          --schema trusted/examples/actions/schemas/reduced-pull-request.schema.json
          --expected-repository "$EXPECTED_REPOSITORY"

      - name: Apply one trusted full-snapshot update
        env:
          GH_TOKEN: ${{ github.token }}
          SLATE_DATA: ${{ runner.temp }}/gh-slate-pr-data.json
        run: >-
          gh-slate apply ci-dashboard
          --target "$GH_SLATE_TARGET"
          --repo "$GH_SLATE_REPOSITORY"
          --mode upsert
          --data "$SLATE_DATA"
          --schema trusted/examples/actions/schemas/pull-request-dashboard.schema.json
          --template trusted/examples/actions/templates/pull-request-dashboard.md.j2
          --json
